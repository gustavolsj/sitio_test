---
layout: default
---

<style>
  .posts-gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .post-card a {
    display: block;
    aspect-ratio: 1 / 1;
    overflow: hidden;
  }

  .post-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }

  .post-card a:hover img {
    transform: scale(1.25);
  }

  @media (max-width: 1024px) {
    .posts-gallery { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 768px) {
    .posts-gallery { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .posts-gallery { grid-template-columns: 1fr; }
  }
</style>

<div class="posts-gallery">
  {% for post in site.posts %}
    <article class="post-card">
      <a href="{{ site.baseurl }}{{ post.url }}" aria-label="{{ post.title }}">
        <img
          src="{{ post.image | default: '/assets/img/default.jpg' | relative_url }}"
          alt="{{ post.title }}">
      </a>
    </article>
  {% endfor %}
</div>
